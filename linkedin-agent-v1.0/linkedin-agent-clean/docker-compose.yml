version: '3.9'

services:

  backend:
    build: ./backend
    container_name: linkedin-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      LINKEDIN_REDIRECT_URI: http://localhost:8000/api/linkedin/callback
      LINKEDIN_OAUTH_SUCCESS_URL: http://localhost:3000/?linkedin=connected
      LINKEDIN_OAUTH_ERROR_URL: http://localhost:3000/?linkedin_error=1
    volumes:
      - ./backend:/app
      - linkedin-agent-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: linkedin-agent-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  linkedin-agent-data:
