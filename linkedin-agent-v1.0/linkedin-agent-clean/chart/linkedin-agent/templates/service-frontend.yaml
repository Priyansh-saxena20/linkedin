apiVersion: v1
kind: Service
metadata:
  name: {{ include "linkedin-agent.frontendServiceName" . }}
  labels:
    app.kubernetes.io/component: frontend
    {{- include "linkedin-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.serviceFrontend.type }}
  selector:
    app.kubernetes.io/component: frontend
    {{- include "linkedin-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.serviceFrontend.port }}
      targetPort: http
