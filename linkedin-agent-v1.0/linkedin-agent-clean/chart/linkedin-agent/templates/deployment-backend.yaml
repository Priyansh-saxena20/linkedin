apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "linkedin-agent.fullname" . }}-backend
  labels:
    app.kubernetes.io/component: backend
    {{- include "linkedin-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      {{- include "linkedin-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/component: backend
        {{- include "linkedin-agent.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.imageBackend.repository }}:{{ .Values.imageBackend.tag }}"
          imagePullPolicy: {{ .Values.imageBackend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ include "linkedin-agent.secretName" . }}
          env:
            - name: CORS_ORIGINS
              value: {{ include "linkedin-agent.corsOriginsValue" . | quote }}
            - name: DATA_DIR
              value: /app/data
            - name: LINKEDIN_REDIRECT_URI
              value: {{ printf "%s://%s%s" .Values.linkedin.oauthScheme .Values.ingress.host .Values.linkedin.redirectPath | quote }}
            - name: LINKEDIN_OAUTH_SUCCESS_URL
              value: {{ printf "%s://%s%s" .Values.linkedin.oauthScheme .Values.ingress.host .Values.linkedin.successPath | quote }}
            - name: LINKEDIN_OAUTH_ERROR_URL
              value: {{ printf "%s://%s%s" .Values.linkedin.oauthScheme .Values.ingress.host .Values.linkedin.errorPath | quote }}
          volumeMounts:
            - name: linkedin-data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: linkedin-data
          emptyDir: {}
