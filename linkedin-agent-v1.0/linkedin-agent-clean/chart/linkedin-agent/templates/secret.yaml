{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "linkedin-agent.fullname" . }}-env
  labels:
    {{- include "linkedin-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  LINKEDIN_CLIENT_ID: {{ .Values.secrets.linkedinClientId | quote }}
  LINKEDIN_CLIENT_SECRET: {{ .Values.secrets.linkedinClientSecret | quote }}
  LINKEDIN_ACCESS_TOKEN: {{ .Values.secrets.linkedinAccessToken | quote }}
  LINKEDIN_PERSON_URN: {{ .Values.secrets.linkedinPersonUrn | quote }}
{{- end }}
